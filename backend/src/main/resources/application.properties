spring.application.name=crm

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

loyalty.discount.threshold=500
loyalty.discount.min-percent=2
loyalty.discount.max-percent=20
loyalty.profit.estimated-margin-percent=28
loyalty.profit.min-retained-margin-percent=10
loyalty.profit.max-discount-share-of-profit-percent=50